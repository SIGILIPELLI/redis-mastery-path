site_name: Redis Mastery Path
site_description: A hands-on Redis course — strings, hashes, lists, sets, sorted sets, streams, caching patterns, rate limiting, locks, Lua and functions, JSON and vector search, persistence, replication, Sentinel, Cluster, ACLs and operations.
site_url: https://sigilipelli.github.io/redis-mastery-path/
repo_url: https://github.com/sigilipelli/redis-mastery-path
repo_name: redis-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Redis Foundations":
      - Overview: level-1/index.md
      - "01 · What Redis Is: One Thread, Memory & a Local Lab": level-1/01-what-redis-is-and-a-lab.md
      - "02 · redis-cli & the RESP Protocol": level-1/02-redis-cli-and-resp.md
      - "03 · Strings, Counters & Expiry": level-1/03-strings-counters-expiry.md
      - "04 · The Keyspace: Naming, SCAN & Safe Deletes": level-1/04-keyspace-scan-delete.md
      - "05 · Hashes & Per-Field Expiry": level-1/05-hashes.md
      - "06 · Lists: Queues, Stacks & Blocking Pops": level-1/06-lists-queues.md
      - "07 · Sets: Membership, Set Algebra & Random Picks": level-1/07-sets.md
      - "08 · Sorted Sets: Rankings, Ranges & Time Windows": level-1/08-sorted-sets.md
      - "09 · Clients: redis-py & node-redis": level-1/09-clients-python-node.md
      - "10 · Project — URL Shortener with Click Analytics": level-1/10-project-url-shortener.md
